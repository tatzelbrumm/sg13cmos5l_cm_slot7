<text fill="#222222"  xml:space="preserve" font-size="11.679" style="font-family:Monospace;" transform="translate(40.0118, 267.919)" >.lib cornerMOSlv.lib mos_CACE{corner_mos}</text>
<text fill="#222222"  xml:space="preserve" font-size="11.679" style="font-family:Monospace;" transform="translate(40.0118, 281.315)" >.lib cornerMOShv.lib mos_CACE{corner_mos}</text>
<text fill="#222222"  xml:space="preserve" font-size="11.679" transform="translate(32.5253, 325.646)" >NGSPICE</text>
<text fill="#222222"  xml:space="preserve" font-size="11.679" style="font-family:Monospace;" transform="translate(40.0118, 357.758)" >.include CACE{DUT_path}</text>
<text fill="#222222"  xml:space="preserve" font-size="11.679" style="font-family:Monospace;" transform="translate(40.0118, 371.154)" >.temp CACE{temp}</text>
<text fill="#222222"  xml:space="preserve" font-size="11.679" style="font-family:Monospace;" transform="translate(40.0118, 384.55)" >.options gmin=1e-12 abstol=1e-12 reltol=1e-4</text>
<text fill="#222222"  xml:space="preserve" font-size="11.679" style="font-family:Monospace;" transform="translate(40.0118, 397.945)" >.option method=gear cshunt=1e-15</text>
<text fill="#222222"  xml:space="preserve" font-size="11.679" style="font-family:Monospace;" transform="translate(40.0118, 411.341)" >.option warn=1</text>
<text fill="#222222"  xml:space="preserve" font-size="11.679" style="font-family:Monospace;" transform="translate(40.0118, 424.737)" >* sup: 0 = (vddl, vddh) = (1.08, 3.0) V, 1 = (1.32, 3.6) V, 0.5 = nominal (1.2, 3.3) V</text>
<text fill="#222222"  xml:space="preserve" font-size="11.679" style="font-family:Monospace;" transform="translate(40.0118, 438.133)" >.param s=CACE{sup}</text>
<text fill="#222222"  xml:space="preserve" font-size="11.679" style="font-family:Monospace;" transform="translate(40.0118, 451.529)" >.param vl={1.08+0.24*s} vh={3.0+0.6*s}</text>
<text fill="#222222"  xml:space="preserve" font-size="11.679" style="font-family:Monospace;" transform="translate(40.0118, 464.924)" >Vh vddh 0 {vh}</text>
<text fill="#222222"  xml:space="preserve" font-size="11.679" style="font-family:Monospace;" transform="translate(40.0118, 478.32)" >Cl0 en_3v3 0 CACE{cload}</text>
<text fill="#222222"  xml:space="preserve" font-size="11.679" style="font-family:Monospace;" transform="translate(40.0118, 491.716)" >Cl1 sel0_3v3 0 10f</text>
<text fill="#222222"  xml:space="preserve" font-size="11.679" style="font-family:Monospace;" transform="translate(40.0118, 505.112)" >Cl2 sel1_3v3 0 10f</text>
<text fill="#222222"  xml:space="preserve" font-size="11.679" style="font-family:Monospace;" transform="translate(40.0118, 518.508)" >* enable (rise at 20 ns) and disable (fall at 520 ns) of en_1v2, 100 ps edges; vddl off or floating, senses on</text>
<text fill="#222222"  xml:space="preserve" font-size="11.679" style="font-family:Monospace;" transform="translate(40.0118, 531.904)" >* scenario 1: vddl = 0 (slot vdd_1v2 off); 2: vddl floating (1e12 ohm to 0.62 V)</text>
<text fill="#222222"  xml:space="preserve" font-size="11.679" style="font-family:Monospace;" transform="translate(40.0118, 545.299)" >.param sc=CACE{scenario}</text>
<text fill="#222222"  xml:space="preserve" font-size="11.679" style="font-family:Monospace;" transform="translate(40.0118, 558.695)" >Vl vlsrc 0 {(sc==1) ? 0 : 0.62}</text>
<text fill="#222222"  xml:space="preserve" font-size="11.679" style="font-family:Monospace;" transform="translate(40.0118, 572.091)" >Rl vlsrc vddl 1e12</text>
<text fill="#222222"  xml:space="preserve" font-size="11.679" style="font-family:Monospace;" transform="translate(40.0118, 585.487)" >Ven en_1v2 0 PULSE(0 {vl} 20n 100p 100p 500n 2u)</text>
<text fill="#222222"  xml:space="preserve" font-size="11.679" style="font-family:Monospace;" transform="translate(40.0118, 598.883)" >Vs0 sel0_1v2 0 0</text>
<text fill="#222222"  xml:space="preserve" font-size="11.679" style="font-family:Monospace;" transform="translate(40.0118, 612.279)" >Vs1 sel1_1v2 0 0</text>
<text fill="#222222"  xml:space="preserve" font-size="11.679" style="font-family:Monospace;" transform="translate(40.0118, 625.674)" >V12 vdd1v2_sense 0 {vl}</text>
<text fill="#222222"  xml:space="preserve" font-size="11.679" style="font-family:Monospace;" transform="translate(40.0118, 639.07)" >V33 vdd3v3_sense 0 {vh}</text>
<text fill="#222222"  xml:space="preserve" font-size="11.679" style="font-family:Monospace;" transform="translate(40.0118, 652.466)" >.control</text>
<text fill="#222222"  xml:space="preserve" font-size="11.679" style="font-family:Monospace;" transform="translate(40.0118, 665.862)" >tran 50p 1.6u</text>
<text fill="#222222"  xml:space="preserve" font-size="11.679" style="font-family:Monospace;" transform="translate(40.0118, 679.258)" >let vmh = CACE{sup} * 0.6 + 3.0</text>
<text fill="#222222"  xml:space="preserve" font-size="11.679" style="font-family:Monospace;" transform="translate(40.0118, 692.653)" >let vmh2 = vmh / 2</text>
<text fill="#222222"  xml:space="preserve" font-size="11.679" style="font-family:Monospace;" transform="translate(40.0118, 706.049)" >let vml2 = (CACE{sup} * 0.24 + 1.08) / 2</text>
<text fill="#222222"  xml:space="preserve" font-size="11.679" style="font-family:Monospace;" transform="translate(40.0118, 719.445)" >meas tran td_on trig v(en_1v2) val=$&amp;vml2 rise=1 targ v(en_3v3) val=$&amp;vmh2 rise=1</text>
<text fill="#222222"  xml:space="preserve" font-size="11.679" style="font-family:Monospace;" transform="translate(40.0118, 732.841)" >meas tran td_off trig v(en_1v2) val=$&amp;vml2 fall=1 targ v(en_3v3) val=$&amp;vmh2 fall=1</text>
<text fill="#222222"  xml:space="preserve" font-size="11.679" style="font-family:Monospace;" transform="translate(40.0118, 746.237)" >meas tran Ven_end find v(en_3v3) at=1.5u</text>
<text fill="#222222"  xml:space="preserve" font-size="11.679" style="font-family:Monospace;" transform="translate(40.0118, 759.633)" >echo $&amp;td_on $&amp;td_off $&amp;Ven_end &gt; CACE{simpath}/CACE{filename}_CACE{N}.data</text>
<text fill="#222222"  xml:space="preserve" font-size="11.679" style="font-family:Monospace;" transform="translate(40.0118, 773.028)" >.endc</text>
