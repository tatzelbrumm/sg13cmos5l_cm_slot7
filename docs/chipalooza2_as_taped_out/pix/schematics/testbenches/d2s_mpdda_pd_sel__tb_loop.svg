<text fill="#222222"  xml:space="preserve" font-size="11.6895" transform="translate(57.0689, 109.965)" >MODEL</text>
<text fill="#222222"  xml:space="preserve" font-size="11.6895" style="font-family:Monospace;" transform="translate(64.5622, 142.106)" >.lib cornerMOShv.lib mos_CACE{corner_mos}</text>
<text fill="#222222"  xml:space="preserve" font-size="11.6895" style="font-family:Monospace;" transform="translate(64.5622, 155.514)" >.lib cornerRES.lib res_CACE{corner_r=typ}</text>
<text fill="#222222"  xml:space="preserve" font-size="11.6895" style="font-family:Monospace;" transform="translate(64.5622, 168.922)" >.lib cornerCAP.lib cap_CACE{corner_c=typ}</text>
<text fill="#222222"  xml:space="preserve" font-size="11.6895" style="font-family:Monospace;" transform="translate(64.5622, 182.33)" >.lib cornerPNP.lib CACE{corner_pnp=typ}</text>
<text fill="#222222"  xml:space="preserve" font-size="11.6895" transform="translate(57.0689, 229.857)" >SOURCES</text>
<text fill="#222222"  xml:space="preserve" font-size="11.6895" style="font-family:Monospace;" transform="translate(64.5622, 261.999)" >* all rails on one supply (the pad's iovdd / iovss); en_3v3 tied to vdd, en_3v3_b to 0</text>
<text fill="#222222"  xml:space="preserve" font-size="11.6895" style="font-family:Monospace;" transform="translate(64.5622, 275.406)" >Vdd vdd 0 CACE{vdd}</text>
<text fill="#222222"  xml:space="preserve" font-size="11.6895" style="font-family:Monospace;" transform="translate(64.5622, 288.814)" >Vs0 s0 0 CACE[(CACE{sel=0} % 2)*CACE{vdd}]</text>
<text fill="#222222"  xml:space="preserve" font-size="11.6895" style="font-family:Monospace;" transform="translate(64.5622, 302.222)" >Vs1 s1 0 CACE[floor(CACE{sel=0} / 2)*CACE{vdd}]</text>
<text fill="#222222"  xml:space="preserve" font-size="11.6895" style="font-family:Monospace;" transform="translate(64.5622, 315.63)" >Vext vext 0 3.3</text>
<text fill="#222222"  xml:space="preserve" font-size="11.6895" style="font-family:Monospace;" transform="translate(64.5622, 329.038)" >Iext xg 0 CACE{ibias=5e-6}</text>
<text fill="#222222"  xml:space="preserve" font-size="11.6895" style="font-family:Monospace;" transform="translate(64.5622, 342.446)" >XEd xg xg vext vext sg13_hv_pmos w=5u l=6u</text>
<text fill="#222222"  xml:space="preserve" font-size="11.6895" style="font-family:Monospace;" transform="translate(64.5622, 355.854)" >XEm ibias xg vext vext sg13_hv_pmos w=5u l=6u</text>
<text fill="#222222"  xml:space="preserve" font-size="11.6895" style="font-family:Monospace;" transform="translate(64.5622, 369.262)" >Vref vref 0 CACE{vref=1.65}</text>
<text fill="#222222"  xml:space="preserve" font-size="11.6895" style="font-family:Monospace;" transform="translate(64.5622, 382.67)" >Vic vic 0 CACE{vicm=1.65}</text>
<text fill="#222222"  xml:space="preserve" font-size="11.6895" style="font-family:Monospace;" transform="translate(64.5622, 396.077)" >Ep vinp vic 0 0 0.5</text>
<text fill="#222222"  xml:space="preserve" font-size="11.6895" style="font-family:Monospace;" transform="translate(64.5622, 409.485)" >En vinn vic 0 0 -0.5</text>
<text fill="#222222"  xml:space="preserve" font-size="11.6895" style="font-family:Monospace;" transform="translate(64.5622, 422.893)" >* loop broken at vfb: DC through Lb, AC injected through Cb</text>
<text fill="#222222"  xml:space="preserve" font-size="11.6895" style="font-family:Monospace;" transform="translate(64.5622, 436.301)" >Lb vout fb 1G</text>
<text fill="#222222"  xml:space="preserve" font-size="11.6895" style="font-family:Monospace;" transform="translate(64.5622, 449.709)" >Cb fb inj 1</text>
<text fill="#222222"  xml:space="preserve" font-size="11.6895" style="font-family:Monospace;" transform="translate(64.5622, 463.117)" >Vinj inj 0 dc 0 ac 1</text>
<text fill="#222222"  xml:space="preserve" font-size="11.6895" style="font-family:Monospace;" transform="translate(64.5622, 476.525)" >RL vout vterm CACE{rload=1000}</text>
<text fill="#222222"  xml:space="preserve" font-size="11.6895" style="font-family:Monospace;" transform="translate(64.5622, 489.933)" >Vterm vterm 0 CACE{vterm=1.65}</text>
<text fill="#222222"  xml:space="preserve" font-size="11.6895" style="font-family:Monospace;" transform="translate(64.5622, 503.341)" >CL vout 0 CACE{cload=1e-10}</text>
<text fill="#222222"  xml:space="preserve" font-size="11.6895" transform="translate(1330.93, 109.965)" >NGSPICE</text>
<text fill="#222222"  xml:space="preserve" font-size="11.6895" style="font-family:Monospace;" transform="translate(1338.42, 142.106)" >.include CACE{DUT_path}</text>
<text fill="#222222"  xml:space="preserve" font-size="11.6895" style="font-family:Monospace;" transform="translate(1338.42, 155.514)" >.temp CACE{temp}</text>
<text fill="#222222"  xml:space="preserve" font-size="11.6895" style="font-family:Monospace;" transform="translate(1338.42, 168.922)" >.options savecurrents klu method=gear reltol=1e-4 abstol=1e-15 gmin=1e-15</text>
<text fill="#222222"  xml:space="preserve" font-size="11.6895" style="font-family:Monospace;" transform="translate(1338.42, 182.33)" >.option warn=1</text>
<text fill="#222222"  xml:space="preserve" font-size="11.6895" style="font-family:Monospace;" transform="translate(1338.42, 195.737)" >.control</text>
<text fill="#222222"  xml:space="preserve" font-size="11.6895" style="font-family:Monospace;" transform="translate(1338.42, 209.145)" >save v(vout) v(fb)</text>
<text fill="#222222"  xml:space="preserve" font-size="11.6895" style="font-family:Monospace;" transform="translate(1338.42, 222.553)" >ac dec 50 1 1G</text>
<text fill="#222222"  xml:space="preserve" font-size="11.6895" style="font-family:Monospace;" transform="translate(1338.42, 235.961)" >let T = -v(vout)/v(fb)</text>
<text fill="#222222"  xml:space="preserve" font-size="11.6895" style="font-family:Monospace;" transform="translate(1338.42, 249.369)" >let Tdb = vdb(T)</text>
<text fill="#222222"  xml:space="preserve" font-size="11.6895" style="font-family:Monospace;" transform="translate(1338.42, 262.777)" >let Tph = cph(T)*180/pi</text>
<text fill="#222222"  xml:space="preserve" font-size="11.6895" style="font-family:Monospace;" transform="translate(1338.42, 276.185)" >meas ac T0 find Tdb at=10</text>
<text fill="#222222"  xml:space="preserve" font-size="11.6895" style="font-family:Monospace;" transform="translate(1338.42, 289.593)" >let fc = 0</text>
<text fill="#222222"  xml:space="preserve" font-size="11.6895" style="font-family:Monospace;" transform="translate(1338.42, 303.001)" >meas ac fc when Tdb=0 fall=1</text>
<text fill="#222222"  xml:space="preserve" font-size="11.6895" style="font-family:Monospace;" transform="translate(1338.42, 316.408)" >let phc = -180</text>
<text fill="#222222"  xml:space="preserve" font-size="11.6895" style="font-family:Monospace;" transform="translate(1338.42, 329.816)" >meas ac phc find Tph when Tdb=0 fall=1</text>
<text fill="#222222"  xml:space="preserve" font-size="11.6895" style="font-family:Monospace;" transform="translate(1338.42, 343.224)" >let PM = 180 + phc</text>
<text fill="#222222"  xml:space="preserve" font-size="11.6895" style="font-family:Monospace;" transform="translate(1338.42, 356.632)" >let gmdb = -1000</text>
<text fill="#222222"  xml:space="preserve" font-size="11.6895" style="font-family:Monospace;" transform="translate(1338.42, 370.04)" >meas ac gmdb find Tdb when Tph=-180 cross=1</text>
<text fill="#222222"  xml:space="preserve" font-size="11.6895" style="font-family:Monospace;" transform="translate(1338.42, 383.448)" >let GM = -gmdb</text>
<text fill="#222222"  xml:space="preserve" font-size="11.6895" style="font-family:Monospace;" transform="translate(1338.42, 396.856)" >echo $&amp;T0 $&amp;fc $&amp;PM $&amp;GM &gt; CACE{filename}_CACE{N}.data</text>
<text fill="#222222"  xml:space="preserve" font-size="11.6895" style="font-family:Monospace;" transform="translate(1338.42, 410.264)" >.endc</text>
<text fill="#222222"  xml:space="preserve" font-size="23.3791" transform="translate(53.3222, 38.1527)" >CACE template: loop gain of the pad driver (fixture d2s_mpdda_pd_sel, loop opened at vfb)</text>
<text fill="#222222"  xml:space="preserve" font-size="9.74127" transform="translate(53.3222, 93.2092)" >run directory: CACE{simpath}</text>
</svg>
