<text fill="#222222"  xml:space="preserve" font-size="14.1622" style="font-family:Monospace;" transform="translate(39.0791, 322.924)" >.lib cornerMOSlv.lib mos_CACE{corner_mos}</text>
<text fill="#222222"  xml:space="preserve" font-size="14.1622" style="font-family:Monospace;" transform="translate(39.0791, 339.168)" >.lib cornerMOShv.lib mos_CACE{corner_mos}</text>
<text fill="#222222"  xml:space="preserve" font-size="14.1622" transform="translate(30.0007, 392.924)" >NGSPICE</text>
<text fill="#222222"  xml:space="preserve" font-size="14.1622" style="font-family:Monospace;" transform="translate(39.0791, 431.864)" >.include CACE{DUT_path}</text>
<text fill="#222222"  xml:space="preserve" font-size="14.1622" style="font-family:Monospace;" transform="translate(39.0791, 448.108)" >.temp CACE{temp}</text>
<text fill="#222222"  xml:space="preserve" font-size="14.1622" style="font-family:Monospace;" transform="translate(39.0791, 464.352)" >.options gmin=1e-12 abstol=1e-12 reltol=1e-4</text>
<text fill="#222222"  xml:space="preserve" font-size="14.1622" style="font-family:Monospace;" transform="translate(39.0791, 480.596)" >.option method=gear cshunt=1e-15</text>
<text fill="#222222"  xml:space="preserve" font-size="14.1622" style="font-family:Monospace;" transform="translate(39.0791, 496.84)" >.option warn=1</text>
<text fill="#222222"  xml:space="preserve" font-size="14.1622" style="font-family:Monospace;" transform="translate(39.0791, 513.084)" >* sup: 0 = (vddl, vddh) = (1.08, 3.0) V, 1 = (1.32, 3.6) V, 0.5 = nominal (1.2, 3.3) V</text>
<text fill="#222222"  xml:space="preserve" font-size="14.1622" style="font-family:Monospace;" transform="translate(39.0791, 529.328)" >.param s=CACE{sup}</text>
<text fill="#222222"  xml:space="preserve" font-size="14.1622" style="font-family:Monospace;" transform="translate(39.0791, 545.572)" >.param vl={1.08+0.24*s} vh={3.0+0.6*s}</text>
<text fill="#222222"  xml:space="preserve" font-size="14.1622" style="font-family:Monospace;" transform="translate(39.0791, 561.816)" >Vh vddh 0 {vh}</text>
<text fill="#222222"  xml:space="preserve" font-size="14.1622" style="font-family:Monospace;" transform="translate(39.0791, 578.06)" >Cl0 en_3v3 0 CACE{cload}</text>
<text fill="#222222"  xml:space="preserve" font-size="14.1622" style="font-family:Monospace;" transform="translate(39.0791, 594.304)" >Cl1 sel0_3v3 0 10f</text>
<text fill="#222222"  xml:space="preserve" font-size="14.1622" style="font-family:Monospace;" transform="translate(39.0791, 610.548)" >Cl2 sel1_3v3 0 10f</text>
<text fill="#222222"  xml:space="preserve" font-size="14.1622" style="font-family:Monospace;" transform="translate(39.0791, 626.792)" >* enable (rise at 20 ns) and disable (fall at 520 ns) of en_1v2, 100 ps edges; vddl and both senses on</text>
<text fill="#222222"  xml:space="preserve" font-size="14.1622" style="font-family:Monospace;" transform="translate(39.0791, 643.036)" >Vl vddl 0 {vl}</text>
<text fill="#222222"  xml:space="preserve" font-size="14.1622" style="font-family:Monospace;" transform="translate(39.0791, 659.28)" >Ven en_1v2 0 PULSE(0 {vl} 20n 100p 100p 500n 2u)</text>
<text fill="#222222"  xml:space="preserve" font-size="14.1622" style="font-family:Monospace;" transform="translate(39.0791, 675.524)" >Vs0 sel0_1v2 0 0</text>
<text fill="#222222"  xml:space="preserve" font-size="14.1622" style="font-family:Monospace;" transform="translate(39.0791, 691.769)" >Vs1 sel1_1v2 0 0</text>
<text fill="#222222"  xml:space="preserve" font-size="14.1622" style="font-family:Monospace;" transform="translate(39.0791, 708.013)" >V12 vdd1v2_sense 0 {vl}</text>
<text fill="#222222"  xml:space="preserve" font-size="14.1622" style="font-family:Monospace;" transform="translate(39.0791, 724.257)" >V33 vdd3v3_sense 0 {vh}</text>
<text fill="#222222"  xml:space="preserve" font-size="14.1622" style="font-family:Monospace;" transform="translate(39.0791, 740.501)" >.control</text>
<text fill="#222222"  xml:space="preserve" font-size="14.1622" style="font-family:Monospace;" transform="translate(39.0791, 756.745)" >tran 50p 1.6u</text>
<text fill="#222222"  xml:space="preserve" font-size="14.1622" style="font-family:Monospace;" transform="translate(39.0791, 772.989)" >let vmh = CACE{sup} * 0.6 + 3.0</text>
<text fill="#222222"  xml:space="preserve" font-size="14.1622" style="font-family:Monospace;" transform="translate(39.0791, 789.233)" >let vmh2 = vmh / 2</text>
<text fill="#222222"  xml:space="preserve" font-size="14.1622" style="font-family:Monospace;" transform="translate(39.0791, 805.477)" >let vml2 = (CACE{sup} * 0.24 + 1.08) / 2</text>
<text fill="#222222"  xml:space="preserve" font-size="14.1622" style="font-family:Monospace;" transform="translate(39.0791, 821.721)" >meas tran td_on trig v(en_1v2) val=$&amp;vml2 rise=1 targ v(en_3v3) val=$&amp;vmh2 rise=1</text>
<text fill="#222222"  xml:space="preserve" font-size="14.1622" style="font-family:Monospace;" transform="translate(39.0791, 837.965)" >meas tran td_off trig v(en_1v2) val=$&amp;vml2 fall=1 targ v(en_3v3) val=$&amp;vmh2 fall=1</text>
<text fill="#222222"  xml:space="preserve" font-size="14.1622" style="font-family:Monospace;" transform="translate(39.0791, 854.209)" >echo $&amp;td_on $&amp;td_off &gt; CACE{simpath}/CACE{filename}_CACE{N}.data</text>
<text fill="#222222"  xml:space="preserve" font-size="14.1622" style="font-family:Monospace;" transform="translate(39.0791, 870.453)" >.endc</text>
