style="normal">s7_an_1_iref</text><rect x="35" y="505" width="50" height="50" fill="#e8d9a8" stroke="#8a6d1a" stroke-width="1.5"/><rect x="43" y="513" width="34" height="34" fill="none" stroke="#8a6d1a" stroke-width="1"/><text x="60" y="573" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold" font-style="normal">s7_an[0]</text><path d="M85,530 L158,530" fill="none" stroke="#1f5fbf" stroke-width="2.4" marker-end="url(#a_1f5fbf)"/><text x="120" y="522" font-size="11" fill="#1f5fbf" text-anchor="middle" font-weight="normal" font-style="normal">pad</text><rect x="160" y="450" width="255" height="140" rx="6" fill="#edf3fc" stroke="#1f5fbf" stroke-width="1.4"/><text x="170" y="490" font-size="14" font-weight="bold" fill="#222222">S2D pad (custom cell)</text><text x="170" y="508" font-size="13" font-weight="normal" fill="#222222">sg13cmos5l_IOPadSingle2Diff</text><text x="170" y="526" font-size="13" font-weight="normal" fill="#222222">outp − outn = 2 (pad − vref)</text><text x="170" y="544" font-size="13" font-weight="normal" fill="#222222">(outp + outn)/2 = vcm</text><text x="170" y="562" font-size="13" font-weight="normal" fill="#222222">input 0 … 1 V (vref ≈ 0.5 V)</text><text x="225" y="466" font-size="10" fill="#2e7d32" text-anchor="middle" font-weight="normal" font-style="normal">vref</text><text x="290" y="466" font-size="10" fill="#2e7d32" text-anchor="middle" font-weight="normal" font-style="normal">vcm</text><text x="380" y="466" font-size="10" fill="#c25e00" text-anchor="middle" font-weight="normal" font-style="normal">iref</text><rect x="470" y="440" width="300" height="168" rx="6" fill="#f5f8fd" stroke="#1f5fbf" stroke-width="1.4"/><text x="480" y="460" font-size="13" font-weight="bold" fill="#222222">switch matrix (10 × tg_hv)</text><text x="480" y="477" font-size="12" font-weight="normal" fill="#222222">ld: XT1, XT2  outp→vinp, outn→vinn</text><text x="480" y="494" font-size="12" font-weight="normal" fill="#222222">lx: XT3, XT4  outp→vinn, outn→vinp</text><text x="480" y="511" font-size="12" font-weight="normal" fill="#222222">sb: XT5, XT6  outp→bus0, outn→bus1</text><text x="480" y="528" font-size="12" font-weight="normal" fill="#222222">bd: XT7, XT8  bus0→vinp, bus1→vinn</text><text x="480" y="545" font-size="12" font-weight="normal" fill="#222222">(rc: XT9, XT10, above)</text><path d="M415,510 L468,510" fill="none" stroke="#1f5fbf" stroke-width="2.4" marker-end="url(#a_1f5fbf)"/><path d="M415,555 L468,555" fill="none" stroke="#1f5fbf" stroke-width="2.4" marker-end="url(#a_1f5fbf)"/><text x="441" y="503" font-size="11" fill="#1f5fbf" text-anchor="middle" font-weight="normal" font-style="normal">outp</text><text x="441" y="548" font-size="11" fill="#1f5fbf" text-anchor="middle" font-weight="normal" font-style="normal">outn</text><path d="M770,510 L818,510" fill="none" stroke="#1f5fbf" stroke-width="2.4" marker-end="url(#a_1f5fbf)"/><path d="M770,555 L818,555" fill="none" stroke="#1f5fbf" stroke-width="2.4" marker-end="url(#a_1f5fbf)"/><text x="794" y="503" font-size="11" fill="#1f5fbf" text-anchor="middle" font-weight="normal" font-style="normal">vinp</text><text x="794" y="548" font-size="11" fill="#1f5fbf" text-anchor="middle" font-weight="normal" font-style="normal">vinn</text><path d="M500,137 L500,438" fill="none" stroke="#7b3fa0" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#a_7b3fa0)"/><text x="506" y="420" font-size="11" fill="#7b3fa0" text-anchor="start" font-weight="normal" font-style="normal">ld, lx, sb, bd</text><rect x="820" y="450" width="255" height="140" rx="6" fill="#edf3fc" stroke="#1f5fbf" stroke-width="1.4"/><text x="830" y="490" font-size="14" font-weight="bold" fill="#222222">D2S pad (custom cell)</text><text x="830" y="508" font-size="13" font-weight="normal" fill="#222222">sg13cmos5l_IOPadDiff2Single</text><text x="830" y="526" font-size="13" font-weight="normal" fill="#222222">pad − vref = (vinp − vinn)/2</text><text x="830" y="544" font-size="13" font-weight="normal" fill="#222222">vref = vcm ≈ 1.26 V</text><text x="830" y="562" font-size="13" font-weight="normal" fill="#222222">class-AB output stage</text><text x="990" y="466" font-size="10" fill="#2e7d32" text-anchor="middle" font-weight="normal" font-style="normal">vref</text><text x="1040" y="466" font-size="10" fill="#c25e00" text-anchor="middle" font-weight="normal" font-style="normal">iref</text><path d="M1075,530 L1108,530" fill="none" stroke="#1f5fbf" stroke-width="2.4" marker-end="url(#a_1f5fbf)"/><rect x="1110" y="505" width="50" height="50" fill="#e8d9a8" stroke="#8a6d1a" stroke-width="1.5"/><rect x="1118" y="513" width="34" height="34" fill="none" stroke="#8a6d1a" stroke-width="1"/><text x="1135" y="573" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold" font-style="normal">s7_an[1]</text><path d="M560,668 L1228,668" fill="none" stroke="#666666" stroke-width="4"/><text x="552" y="672" font-size="12" fill="#222222" text-anchor="end" font-weight="bold" font-style="normal">analog_bus0</text><path d="M560,698 L1228,698" fill="none" stroke="#666666" stroke-width="4"/><text x="552" y="702" font-size="12" fill="#222222" text-anchor="end" font-weight="bold" font-style="normal">analog_bus1</text><path d="M560,728 L1228,728" fill="none" stroke="#666666" stroke-width="4"/><text x="552" y="732" font-size="12" fill="#222222" text-anchor="end" font-weight="bold" font-style="normal">analog_bus2</text><path d="M560,758 L1228,758" fill="none" stroke="#666666" stroke-width="4"/><text x="552" y="762" font-size="12" fill="#222222" text-anchor="end" font-weight="bold" font-style="normal">analog_bus3</text><path d="M600,608 L600,668" fill="none" stroke="#1f5fbf" stroke-width="2.4"/><circle cx="600" cy="668" r="3.6" fill="#1f5fbf"/><path d="M640,608 L640,698" fill="none" stroke="#1f5fbf" stroke-width="2.4"/><circle cx="640" cy="698" r="3.6" fill="#1f5fbf"/><text x="606" y="640" font-size="10" fill="#1f5fbf" text-anchor="start" font-weight="normal" font-style="normal">bus0</text><text x="646" y="680" font-size="10" fill="#1f5fbf" text-anchor="start" font-weight="normal" font-style="normal">bus1</text><circle cx="1190" cy="728" r="3.6" fill="#2e7d32"/><circle cx="1215" cy="758" r="3.6" fill="#2e7d32"/><text x="1228" y="785" font-size="11" fill="#222222" text-anchor="end" font-weight="normal" font-style="italic">to the harness's per-slot bus switches</text><rect x="20" y="610" width="440" height="160" rx="6" fill="#ffffff" stroke="#999" stroke-width="1.4"/><text x="30" y="630" font-size="13" font-weight="bold" fill="#222222">modes (dig_in, only with the key)</text><text x="30" y="647" font-size="12" font-weight="normal" fill="#222222">default: loop direct (ld); vcm, vref on bus2 / bus3</text><text x="30" y="664" font-size="12" font-weight="normal" fill="#222222">swap  [0]: loop crossed (lx)</text><text x="30" y="681" font-size="12" font-weight="normal" fill="#222222">mon   [1]: + S2D outputs on bus0 / bus1 (sb)</text><text x="30" y="698" font-size="12" font-weight="normal" fill="#222222">feed  [2]: bus0 / bus1 drive the D2S, loop open (bd)</text><text x="30" y="715" font-size="12" font-weight="normal" fill="#222222">ext   [5]: replica off (rc open), vcm / vref from bus2 / 3</text><text x="30" y="732" font-size="12" font-weight="normal" fill="#222222">default loop: s7_an[1] = vcm + (s7_an[0] − vref)</text><text x="20" y="805" font-size="12" fill="#222222" text-anchor="start" font-weight="normal" font-style="normal">Supplies: vdd_3v3 / vss_3v3 (harness-gated) for every block; the slot works with only vdd_3v3 on. vdd_1v2 only gates s7_doutpd, which holds dig_out[11:0] low.</text><text x="20" y="822" font-size="12" fill="#222222" text-anchor="start" font-weight="normal" font-style="normal">The pad buffers' output stages and ESD sit on the pad ring (iovdd / iovss). Slot 7 as taped out, commit 158afc5; Oguey–Aebischer core not in the slot.</text></svg>
