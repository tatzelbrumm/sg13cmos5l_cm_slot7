anchor="middle" font-weight="normal" font-style="normal">ibg</text><rect x="260" y="190" width="190" height="82" rx="6" fill="#fff4e8" stroke="#c25e00" stroke-width="1.4"/><text x="270" y="210" font-size="14" font-weight="bold" fill="#222222">bias_dist_pd</text><text x="270" y="228" font-size="13" font-weight="normal" fill="#222222">switched 1:1 copies</text><text x="270" y="246" font-size="13" font-weight="normal" fill="#222222">bandgap in; 3 outputs used</text><path d="M300,137 L300,188" fill="none" stroke="#7b3fa0" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#a_7b3fa0)"/><text x="306" y="160" font-size="11" fill="#7b3fa0" text-anchor="start" font-weight="normal" font-style="normal">en, en_b → all blocks</text><path d="M450,210 L528,210" fill="none" stroke="#c25e00" stroke-width="2.4" marker-end="url(#a_c25e00)"/><text x="489" y="202" font-size="11" fill="#c25e00" text-anchor="middle" font-weight="normal" font-style="normal">iprb</text><rect x="530" y="185" width="225" height="100" rx="6" fill="#eef6ee" stroke="#2e7d32" stroke-width="1.4"/><text x="540" y="205" font-size="14" font-weight="bold" fill="#222222">pad_ref_rb: replica bias</text><text x="540" y="223" font-size="13" font-weight="normal" fill="#222222">one bias tree from 5 µA</text><text x="540" y="241" font-size="13" font-weight="normal" fill="#222222">vcm_rb  ≈ 1.26 V</text><text x="540" y="259" font-size="13" font-weight="normal" fill="#222222">vref_rb ≈ 0.49 V</text><path d="M780,210 L790,210" fill="none" stroke="#2e7d32" stroke-width="2.0"/><path d="M790,210 L807,201" fill="none" stroke="#2e7d32" stroke-width="2.0"/><path d="M807,210 L816,210" fill="none" stroke="#2e7d32" stroke-width="2.0"/><circle cx="790" cy="210" r="3.6" fill="#2e7d32"/><circle cx="807" cy="210" r="3.6" fill="#2e7d32"/><path d="M780,250 L790,250" fill="none" stroke="#2e7d32" stroke-width="2.0"/><path d="M790,250 L807,241" fill="none" stroke="#2e7d32" stroke-width="2.0"/><path d="M807,250 L816,250" fill="none" stroke="